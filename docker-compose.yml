services:
  milvus:
    image: milvusdb/milvus:v2.5.11
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ./volumes/milvus:/var/lib/milvus
      - ./embedEtcd.yaml:/milvus/configs/embedEtcd.yaml
      - ./user.yaml:/milvus/configs/user.yaml

  api:
    build: .
    env_file: .env
    environment:
      MILVUS_URI: http://milvus:19530
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
      LLAMACPP_BASE_URL: http://host.docker.internal:8080/v1
    command: uvicorn questbook.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - milvus

  streamlit:
    build: .
    env_file: .env
    environment:
      MILVUS_URI: http://milvus:19530
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
      LLAMACPP_BASE_URL: http://host.docker.internal:8080/v1
    command: streamlit run apps/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - api
