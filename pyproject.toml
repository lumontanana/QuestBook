[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "questbook"
version = "0.1.0"
description = "RAG sobre PDFs con FastAPI, Typer, Streamlit y Milvus."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cohere>=5.5.0",
  "charset-normalizer>=3.3.0",
  "fastapi>=0.111.0",
  "langchain>=0.2.11",
  "langchain-cohere>=0.1.9",
  "langchain-community>=0.2.10",
  "langchain-huggingface>=0.0.3",
  "langchain-milvus>=0.1.4",
  "langchain-openai>=0.1.19",
  "langchain-text-splitters>=0.2.2",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pymilvus>=2.4.4",
  "pypdf>=4.2.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "rich>=13.7.1",
  "sentence-transformers>=3.0.1",
  "streamlit>=1.36.0",
  "structlog>=24.2.0",
  "typer>=0.12.3",
  "uvicorn[standard]>=0.30.1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0"
]

[project.scripts]
questbook = "questbook.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
